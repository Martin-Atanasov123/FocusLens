<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FocusLens</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: #0f1117;
        color: #e6e8ef;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .status {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        margin-bottom: 12px;
        background: #1f2330;
      }
      .status.ok { color: #34d399; }
      .status.bad { color: #f87171; }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid #1f2330;
      }
      .row .domain {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .time { color: #8b90a1; white-space: nowrap; }
      .pair { display: flex; gap: 6px; margin-top: 12px; }
      input {
        flex: 1;
        background: #1f2330;
        border: 1px solid #2c3140;
        color: #e6e8ef;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
      }
      button {
        background: #4f46e5;
        border: none;
        color: white;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .hint { color: #8b90a1; font-size: 11.5px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>FocusLens</h1>
    <div id="status" class="status">Checking agent…</div>
    <div id="summary"></div>
    <div class="pair">
      <input id="token" type="password" placeholder="Pairing token from the desktop app" />
      <button id="save">Save</button>
    </div>
    <p class="hint">
      Hostnames only, sent only to the FocusLens app on this machine (127.0.0.1). Nothing
      leaves your computer.
    </p>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
