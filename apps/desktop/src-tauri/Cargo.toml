[package]
name = "focuslens"
version = "0.1.0"
description = "FocusLens — privacy-first local screen time tracker"
edition = "2021"
rust-version = "1.77"

[lib]
name = "focuslens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
tiny_http = "0.12"
active-win-pos-rs = "0.9"
user-idle = "0.6"
rand = "0.8"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
